[workspace]
resolver = "2"
# Indicare i crates membri del progetto ogni volta che vengono creati
# Esempio: "crates/geo-core"
members = [
    "crates/geo-core",
    "crates/geo-protocol",
    "crates/geo-server",
    "crates/geo-admin",
    "crates/geo-client"
]

# Versioni dichiarate UNA VOLTA SOLA. Le crate figlie devono solo scrivere `tokio = { workspace = true }`.
# Serve a evitare che due crate compilino due versioni diverse della stessa dipendenza.
[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
argon2 = "0.5"
rand = "0.8"
ratatui = "0.26"
crossterm = "0.27"

# Profilo di release orientato alla dimensione del binario (requisiti R18/R19).
# Misurate le dimensioni CON e SENZA queste opzioni: la tabella comparativa va nel report.

# Profilo di release per il calcolo della dimensione del binario.
# Paragonare le dimensioni con e senza queste opzioni attive
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
